<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>putio-sync</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #fff;
    --border: #000;
    --text: #000;
    --dim: #999;
    --accent: #000;
    --green: #0066cc;
    --orange: #cc6600;
    --red: #cc0000;
    --hover: #f0f0f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.5;
  }

  /* Header */
  header {
    background: var(--bg);
    padding: 1.5rem 2rem;
    border-bottom: 3px solid var(--border);
  }
  header h1 {
    font-size: 1.6rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
  }
  header .subtitle {
    color: var(--dim);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 0.25rem;
  }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    max-width: 1600px;
    margin: 0 auto;
    border-left: 3px solid var(--border);
    border-right: 3px solid var(--border);
  }
  @media (max-width: 768px) {
    .layout { grid-template-columns: 1fr; }
    header { padding: 1rem; }
    header h1 { font-size: 1.2rem; }
    body { font-size: 13px; }
  }

  /* Panels */
  .panel {
    background: var(--surface);
    padding: 1.5rem;
    border-bottom: 3px solid var(--border);
  }
  .panel:nth-child(1) { border-right: 3px solid var(--border); }
  @media (max-width: 768px) {
    .panel:nth-child(1) { border-right: none; }
    .panel { padding: 1rem; }
  }
  .panel h2 {
    font-size: 0.75rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--border);
  }

  /* Tree */
  .tree { max-height: 520px; overflow-y: auto; }
  .tree-children { margin-left: 1.2rem; border-left: 2px solid var(--hover); padding-left: 0.5rem; display: none; }
  .tree-children.open { display: block; }
  .tree-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0;
    cursor: default;
  }
  .tree-row:hover { background: var(--hover); }
  .tree-row:hover .tree-label { font-weight: 700; }
  .tree-toggle {
    width: 1.2rem;
    cursor: pointer;
    user-select: none;
    text-align: center;
    font-weight: 900;
    font-size: 0.7rem;
  }
  .tree-checkbox {
    width: 1.1rem;
    height: 1.1rem;
    cursor: pointer;
    accent-color: var(--text);
  }
  .tree-label { cursor: pointer; user-select: none; }
  .tree-loading { color: var(--dim); padding: 0.3rem 0 0.3rem 2rem; }

  /* Selected list */
  .sel-list { list-style: none; min-height: 50px; }
  .sel-list li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 0;
    border-bottom: 2px solid var(--border);
    gap: 0.5rem;
  }
  .sel-list li:last-child { border-bottom: none; }
  .sel-list .path {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
  }
  .sel-list .remove {
    color: var(--red);
    cursor: pointer;
    font-weight: 900;
    font-size: 1rem;
    flex-shrink: 0;
    padding: 0 0.3rem;
  }
  .sel-list .remove:hover { background: var(--red); color: var(--surface); }
  .empty { color: var(--dim); text-align: center; padding: 1.5rem 0; font-style: italic; }

  /* Destination browser */
  .dest-browser { margin-top: 1.5rem; }
  .dest-browser h3 {
    font-size: 0.7rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
  }
  .breadcrumbs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.3rem;
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
    padding: 0.6rem;
    background: var(--bg);
    border: 2px solid var(--border);
    font-weight: 700;
  }
  .crumb { cursor: pointer; }
  .crumb:hover { text-decoration: underline; }
  .crumb-sep { color: var(--dim); }
  .crumb-cur { font-weight: 900; }
  .dest-folders {
    max-height: 200px;
    overflow-y: auto;
    border: 2px solid var(--border);
  }
  .dest-folder {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.6rem 0.8rem;
    cursor: pointer;
    border-bottom: 1px solid var(--hover);
    font-weight: 500;
  }
  .dest-folder:last-child { border-bottom: none; }
  .dest-folder:hover { background: var(--bg); font-weight: 700; }
  .dest-folder .icon { color: var(--dim); width: 1rem; text-align: center; }
  .dest-loading { color: var(--dim); padding: 0.6rem 0.8rem; }

  /* Path preview */
  .preview {
    margin-top: 1rem;
    padding: 0.8rem;
    background: var(--bg);
    border: 2px solid var(--border);
    font-size: 0.8rem;
    max-height: 140px;
    overflow-y: auto;
  }
  .preview-item {
    padding: 0.2rem 0;
    display: flex;
    gap: 0.5rem;
    align-items: baseline;
    flex-wrap: wrap;
  }
  .preview-arrow { color: var(--dim); flex-shrink: 0; font-weight: 900; }
  .preview-src { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .preview-dst { color: var(--green); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
  .preview-empty { color: var(--dim); }

  /* Buttons */
  .btn {
    background: var(--text);
    color: var(--surface);
    border: 3px solid var(--border);
    padding: 0.8rem 1rem;
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    width: 100%;
    margin-top: 1rem;
    font-family: inherit;
  }
  .btn:hover:not(:disabled) { background: var(--surface); color: var(--text); }
  .btn:disabled { opacity: 0.2; cursor: not-allowed; }
  .btn-sm {
    width: auto;
    padding: 0.35rem 0.8rem;
    font-size: 0.7rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0;
    background: var(--surface);
    border: 2px solid var(--border);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
  }
  .btn-sm:hover { background: var(--text); color: var(--surface); }

  /* Status table */
  .status-panel { grid-column: 1 / -1; overflow-x: auto; }
  .status-panel:nth-child(3) { border-right: none; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th, td { text-align: left; padding: 0.7rem; border-bottom: 2px solid var(--border); }
  th {
    color: var(--dim);
    text-transform: uppercase;
    font-size: 0.65rem;
    font-weight: 900;
    letter-spacing: 0.15em;
    border-bottom: 3px solid var(--border);
  }
  td.src, td.dst {
    font-size: 0.8rem;
    max-width: 250px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    font-size: 0.65rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border: 2px solid var(--border);
  }
  .b-running { background: var(--orange); color: var(--surface); }
  .b-completed { background: var(--surface); color: var(--text); }
  .b-error { background: var(--red); color: var(--surface); }
  .b-stopped { background: var(--dim); color: var(--surface); }
  .b-pending { background: var(--bg); color: var(--text); }

  .progress-wrap { display: flex; align-items: center; gap: 0.5rem; }
  .progress-bar {
    width: 100px;
    height: 8px;
    background: var(--bg);
    border: 2px solid var(--border);
  }
  .progress-fill { height: 100%; background: var(--text); }
  .progress-text { font-size: 0.75rem; font-weight: 900; }
  .spinner {
    display: inline-block;
    width: 0.8rem;
    height: 0.8rem;
    border: 2px solid var(--border);
    border-top-color: var(--text);
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 1rem 2rem;
    background: var(--text);
    color: var(--surface);
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    z-index: 100;
    transform: translateY(100%);
    transition: transform 0.2s;
    border-top: 3px solid var(--border);
  }
  .toast.show { transform: translateY(0); }
  .toast.success { background: var(--green); }
  .toast.error { background: var(--red); }
</style>
</head>
<body>
<header>
  <h1>putio-sync</h1>
  <div class="subtitle">selective folder sync to put.io</div>
</header>

<div class="layout">
  <div class="panel">
    <h2>Source</h2>
    <div class="tree" id="tree"></div>
  </div>

  <div class="panel">
    <h2>Destination</h2>
    <ul class="sel-list" id="selList">
      <li class="empty">nothing selected</li>
    </ul>

    <div class="dest-browser">
      <h3>put.io target /{{ dest_root }}</h3>
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <div class="dest-folders" id="destFolders"></div>
    </div>

    <div class="preview" id="preview">
      <div class="preview-empty">select folders to preview paths</div>
    </div>

    <button class="btn" id="syncBtn" onclick="startSync()" disabled>Sync</button>
  </div>

  <div class="panel status-panel">
    <h2>Jobs</h2>
    <table>
      <thead>
        <tr>
          <th>Source</th>
          <th>Destination</th>
          <th>Status</th>
          <th>Progress</th>
          <th>Started</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="statusBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const selected = new Map();
const DEST_ROOT = '{{ dest_root }}';
let destPath = DEST_ROOT;
let destCrumbs = [DEST_ROOT];

// === Source Tree ===
async function loadRemotes() {
  const resp = await fetch('/api/remotes');
  const data = await resp.json();
  const tree = document.getElementById('tree');
  tree.innerHTML = '';
  for (const remote of data.local) {
    tree.appendChild(createNode(remote, '', remote, true));
  }
}

function createNode(name, parentPath, remote, isRoot) {
  const wrapper = document.createElement('div');
  const row = document.createElement('div');
  row.className = 'tree-row';

  const toggle = document.createElement('span');
  toggle.className = 'tree-toggle';
  toggle.textContent = '\u25B6';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'tree-checkbox';
  const fullPath = isRoot ? '' : (parentPath ? parentPath + '/' + name : name);
  const key = remote + ':' + (fullPath || '(root)');
  cb.dataset.key = key;
  if (isRoot) { cb.style.visibility = 'hidden'; }
  cb.onchange = (e) => {
    e.stopPropagation();
    if (cb.checked) selected.set(key, { remote, path: fullPath });
    else selected.delete(key);
    renderSelected();
    renderPreview();
  };

  const label = document.createElement('span');
  label.className = 'tree-label';
  label.textContent = name;

  row.appendChild(toggle);
  row.appendChild(cb);
  row.appendChild(label);

  const children = document.createElement('div');
  children.className = 'tree-children';

  let loaded = false;
  toggle.onclick = async (e) => {
    e.stopPropagation();
    if (children.classList.contains('open')) {
      children.classList.remove('open');
      toggle.textContent = '\u25B6';
    } else {
      if (!loaded) {
        loaded = true;
        const loading = document.createElement('div');
        loading.className = 'tree-loading';
        loading.textContent = 'loading...';
        children.appendChild(loading);
        try {
          const resp = await fetch('/api/browse?remote=' + remote + '&path=' + encodeURIComponent(fullPath));
          const data = await resp.json();
          children.removeChild(loading);
          if (data.dirs.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'tree-loading';
            empty.textContent = '(empty)';
            children.appendChild(empty);
          }
          for (const dir of data.dirs) {
            children.appendChild(createNode(dir, fullPath, remote, false));
          }
        } catch (err) {
          loading.textContent = 'error';
        }
      }
      children.classList.add('open');
      toggle.textContent = '\u25BC';
    }
  };
  label.onclick = (e) => { e.stopPropagation(); toggle.click(); };

  wrapper.appendChild(row);
  wrapper.appendChild(children);
  return wrapper;
}

// === Selected panel ===
function renderSelected() {
  const list = document.getElementById('selList');
  const btn = document.getElementById('syncBtn');
  if (selected.size === 0) {
    list.innerHTML = '<li class="empty">nothing selected</li>';
    btn.disabled = true;
  } else {
    list.innerHTML = '';
    for (const [key, val] of selected) {
      const li = document.createElement('li');
      const span = document.createElement('span');
      span.className = 'path';
      span.textContent = key;
      span.title = key;
      const rm = document.createElement('span');
      rm.className = 'remove';
      rm.textContent = '\u2715';
      rm.onclick = () => {
        selected.delete(key);
        const cb = document.querySelector('.tree-checkbox[data-key="' + CSS.escape(key) + '"]');
        if (cb) cb.checked = false;
        renderSelected();
        renderPreview();
      };
      li.appendChild(span);
      li.appendChild(rm);
      list.appendChild(li);
    }
    btn.disabled = false;
  }
}

// === put.io Destination Browser ===
function renderBreadcrumbs() {
  const bc = document.getElementById('breadcrumbs');
  bc.innerHTML = '';
  for (let i = 0; i < destCrumbs.length; i++) {
    if (i > 0) {
      const sep = document.createElement('span');
      sep.className = 'crumb-sep';
      sep.textContent = '/';
      bc.appendChild(sep);
    }
    const crumb = document.createElement('span');
    if (i === destCrumbs.length - 1) {
      crumb.className = 'crumb-cur';
      crumb.textContent = destCrumbs[i];
    } else {
      crumb.className = 'crumb';
      crumb.textContent = destCrumbs[i];
      crumb.onclick = () => {
        destCrumbs = destCrumbs.slice(0, i + 1);
        destPath = destCrumbs.join('/');
        loadDestFolders();
      };
    }
    bc.appendChild(crumb);
  }
}

async function loadDestFolders() {
  renderBreadcrumbs();
  renderPreview();
  const container = document.getElementById('destFolders');
  container.innerHTML = '<div class="dest-loading">loading...</div>';
  try {
    const resp = await fetch('/api/browse?remote=putio&path=' + encodeURIComponent(destPath));
    const data = await resp.json();
    container.innerHTML = '';
    if (data.dirs.length === 0) {
      container.innerHTML = '<div class="dest-loading">(no subfolders)</div>';
      return;
    }
    for (const dir of data.dirs) {
      const div = document.createElement('div');
      div.className = 'dest-folder';
      div.innerHTML = '<span class="icon">\u25B6</span><span>' + dir + '</span>';
      div.onclick = () => {
        destCrumbs.push(dir);
        destPath = destCrumbs.join('/');
        loadDestFolders();
      };
      container.appendChild(div);
    }
  } catch (err) {
    container.innerHTML = '<div class="dest-loading">error</div>';
  }
}

// === Path Preview ===
function renderPreview() {
  const preview = document.getElementById('preview');
  if (selected.size === 0) {
    preview.innerHTML = '<div class="preview-empty">select folders to preview paths</div>';
    return;
  }
  preview.innerHTML = '';
  for (const [key, val] of selected) {
    const folderName = val.path.split('/').pop();
    const dstFullPath = destPath + '/' + folderName;
    const item = document.createElement('div');
    item.className = 'preview-item';
    item.innerHTML = '<span class="preview-src">' + key + '</span>'
      + '<span class="preview-arrow">\u2192</span>'
      + '<span class="preview-dst">putio:' + dstFullPath + '</span>';
    preview.appendChild(item);
  }
}

// === Sync ===
async function startSync() {
  const items = Array.from(selected.values());
  const btn = document.getElementById('syncBtn');
  btn.disabled = true;
  btn.textContent = 'Starting...';
  try {
    const resp = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items, dst_base: destPath })
    });
    const data = await resp.json();
    showToast('Started ' + data.jobs.length + ' sync job(s)', 'success');
    selected.clear();
    document.querySelectorAll('.tree-checkbox').forEach(cb => cb.checked = false);
    renderSelected();
    renderPreview();
    btn.textContent = 'Sync';
    btn.disabled = false;
    loadStatus();
  } catch (e) {
    showToast('Failed to start sync', 'error');
    btn.textContent = 'Sync';
    btn.disabled = false;
  }
}

// === Status ===
function fmtBytes(b) {
  if (!b || b === 0) return '0 B';
  const u = ['B','KB','MB','GB','TB'];
  const i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(1) + ' ' + u[i];
}
function fmtSpeed(bps) {
  if (!bps || bps === 0) return '';
  return fmtBytes(bps) + '/s';
}
function fmtEta(sec) {
  if (!sec || sec === 0) return '';
  if (sec < 60) return sec + 's left';
  if (sec < 3600) return Math.round(sec / 60) + 'm left';
  return Math.round(sec / 3600) + 'h left';
}

async function loadStatus() {
  try {
    const resp = await fetch('/api/status');
    const data = await resp.json();
    const body = document.getElementById('statusBody');
    if (data.jobs.length === 0) {
      body.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--dim);padding:2rem">no jobs yet</td></tr>';
      return;
    }
    body.innerHTML = '';
    for (const job of data.jobs) {
      const tr = document.createElement('tr');
      let progressCell = '\u2014';
      if (job.status === 'running') {
        const pct = Math.min(job.percentage || 0, 100);
        const speed = job.speed ? fmtSpeed(job.speed) : '';
        const eta = job.eta ? fmtEta(job.eta) : '';
        const transferred = fmtBytes(job.transferred || 0);
        const totalSize = fmtBytes(job.total_size || 0);
        const files = job.current_files || [];
        const transferInfo = (job.completed_transfers || 0) + '/' + (job.total_transfers || 0) + ' files';
        const xfrInfo = files.length > 0
          ? '<div style="font-size:0.7rem;color:var(--dim);margin-top:0.3rem;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + files[0].replace(/"/g, '&quot;') + '">' + (files.length > 1 ? files.length + ' active \u2014 ' : '') + files[0] + '</div>'
          : '';
        progressCell = '<div><div class="progress-wrap"><span class="spinner"></span><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div><span class="progress-text">' + pct + '%</span></div>'
          + '<div style="font-size:0.7rem;color:var(--dim);margin-top:0.25rem">' + transferred + ' / ' + totalSize + ' \u00b7 ' + transferInfo + '</div>'
          + '<div style="font-size:0.7rem;color:var(--dim)">' + speed + (speed && eta ? ' \u00b7 ' : '') + eta + '</div>'
          + xfrInfo + '</div>';
      }
      let actionCell = '';
      if (job.status === 'running') {
        actionCell = '<button class="btn-sm" onclick="stopJob(' + job.id + ')">Stop</button>';
      } else {
        actionCell = '<button class="btn-sm" onclick="rerunJob(' + job.id + ')">Re-run</button>';
      }
      let errTitle = job.error ? ' title="' + job.error.replace(/"/g, '&quot;') + '"' : '';
      tr.innerHTML = '<td class="src" title="' + job.src + '">' + job.src + '</td>'
        + '<td class="dst" title="' + job.dst + '">' + job.dst + '</td>'
        + '<td><span class="badge b-' + job.status + '"' + errTitle + '>' + job.status + '</span></td>'
        + '<td>' + progressCell + '</td>'
        + '<td style="font-size:0.7rem;color:var(--dim)">' + (job.created_at || '\u2014') + '</td>'
        + '<td>' + actionCell + '</td>';
      body.appendChild(tr);
    }
  } catch (e) {
    console.error(e);
  }
}

async function stopJob(id) {
  await fetch('/api/job/' + id + '/stop', { method: 'POST' });
  showToast('Job stopped', 'success');
  loadStatus();
}

async function rerunJob(id) {
  try {
    const resp = await fetch('/api/job/' + id + '/rerun', { method: 'POST' });
    const data = await resp.json();
    if (data.error) {
      showToast(data.error, 'error');
    } else {
      showToast('Re-run started', 'success');
      loadStatus();
    }
  } catch (e) {
    showToast('Failed to re-run', 'error');
  }
}

// === Toast ===
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// === Init ===
loadRemotes();
loadDestFolders();
loadStatus();
setInterval(loadStatus, 5000);
</script>
</body>
</html>
